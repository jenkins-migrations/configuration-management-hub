name: Docker Compose production deployment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_PREFIX: test-IMAGE
  REGISTRY_ADDRESS: my.registry.address.com
  SLACK_CHANNEL: "#deployment-notifications"
  DEPLOY_URL: https://deployment.example.com/
  COMPOSE_FILE: docker-compose.yml
  STACK_PREFIX: my-project-stack-name

jobs:
  test:
    runs-on: [self-hosted, swarm-ci]
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and start test image
        run: |
          docker compose build
          docker compose up -d
      - name: Wait for services
        run: |
          expected_services="$(docker compose config --services | wc -l)"
          for _ in $(seq 1 30); do
            running_services="$(docker compose ps --status running --services | wc -l)"
            if [ "$running_services" -eq "$expected_services" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run tests
        run: |
          docker compose exec -T php-fpm composer --no-ansi --no-interaction tests-ci
          docker compose exec -T php-fpm composer --no-ansi --no-interaction behat-ci
      # actions/upload-artifact@v4
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-reports
          path: build/junit/*.xml
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clover-coverage
          path: build/coverage/clover.xml
          if-no-files-found: warn
      - name: Stop test services
        if: always()
        run: docker compose down || true

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: [self-hosted, swarm-ci]
    permissions:
      contents: write
    outputs:
      deploy_version: ${{ steps.version.outputs.deploy_version }}
      deploy_stack_name: ${{ steps.version.outputs.deploy_stack_name }}
      is_new_version: ${{ steps.version.outputs.is_new_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: version
        name: Determine new version
        run: |
          deploy_version="$(docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro softonic/ci-version@sha256:c42462a455293199629426dc87bf78c01ea348d4b1642a0f3e919ba3b1cf52b3 --compatible-with package.json)"
          deploy_version="$(printf '%s' "$deploy_version" | tr -d '\n')"
          deploy_major_version="$(printf '%s' "$deploy_version" | awk -F'[ .]' '{print $1}')"
          deploy_commit_hash="$(git rev-parse --short=7 HEAD)"
          deploy_build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "deploy_version=$deploy_version"
            echo "deploy_major_version=$deploy_major_version"
            echo "deploy_commit_hash=$deploy_commit_hash"
            echo "deploy_build_date=$deploy_build_date"
            echo "deploy_stack_name=${STACK_PREFIX}-v${deploy_major_version}"
            echo "is_new_version=$([ -n "$deploy_version" ] && echo YES)"
          } >> "$GITHUB_OUTPUT"
      - name: Create release tag
        if: steps.version.outputs.is_new_version == 'YES'
        run: |
          git config user.email "ci-user@email.com"
          git config user.name "GitHub Actions"
          git tag -a "v${{ steps.version.outputs.deploy_version }}" \
            -m "Generated by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Workflow: ${{ github.workflow }}" \
            -m "Run: ${{ github.run_number }}" \
            -m "Branch: ${{ github.ref_name }}"
          git push origin "v${{ steps.version.outputs.deploy_version }}"
      - name: Log in to registry
        if: steps.version.outputs.is_new_version == 'YES'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_ADDRESS" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Build and push images
        if: steps.version.outputs.is_new_version == 'YES'
        run: |
          docker compose -f "$COMPOSE_FILE" build
          docker compose -f "$COMPOSE_FILE" push

  deploy-production:
    if: needs.release.outputs.is_new_version == 'YES'
    needs: release
    runs-on: [self-hosted, swarm-prod]
    environment: production
    concurrency:
      group: compose-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Log in to registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_ADDRESS" --username "$REGISTRY_USERNAME" --password-stdin
      - name: Deploy to production
        run: docker stack deploy "${{ needs.release.outputs.deploy_stack_name }}" -c "$COMPOSE_FILE" --with-registry-auth
      - name: Notify Slack of deployment
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_VERSION: ${{ needs.release.outputs.deploy_version }}
        run: |
          curl --fail-with-body --request POST --header 'Content-type: application/json' \
            --data "{\"channel\":\"${SLACK_CHANNEL}\",\"text\":\"${STACK_PREFIX} production deploy: ${DEPLOY_VERSION}. ${DEPLOY_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
      - name: Notify Slack of deployment failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_VERSION: ${{ needs.release.outputs.deploy_version }}
        run: |
          curl --fail-with-body --request POST --header 'Content-type: application/json' \
            --data "{\"channel\":\"${SLACK_CHANNEL}\",\"text\":\"${STACK_PREFIX} production deploy failed: ${DEPLOY_VERSION}. ${DEPLOY_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
